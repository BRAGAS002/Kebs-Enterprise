<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEBS Enterprise - Database Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        .loading {
            display: none;
            margin: 20px 0;
        }
        .debug-info {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 300px;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            border: 1px solid #dee2e6;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .debug-info.collapsed {
            height: 30px;
            overflow: hidden;
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .debug-header h4 {
            margin: 0;
            font-size: 14px;
        }
        .debug-clear {
            font-size: 12px;
            color: #dc3545;
            cursor: pointer;
            margin-left: 10px;
        }
        .table-actions {
            margin-bottom: 20px;
        }
        .table-info {
            margin-top: 10px;
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>KEBS Enterprise Database Admin</h1>
        <div class="alert alert-info">
            You must be logged in to view database contents.
        </div>
        
        <div id="loginForm">
            <h2>Login</h2>
            <form id="authForm" class="mb-4">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <div id="dbContent" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Database Contents</h2>
                <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
            </div>
            
            <div class="table-actions">
                <div class="row align-items-end">
                    <div class="col-md-6">
                        <label for="tableSelect" class="form-label">Select Table</label>
                        <select class="form-control" id="tableSelect">
                            <option value="">Loading tables...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <div class="table-info" id="tableInfo"></div>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div class="table-container">
                <table class="table table-striped table-hover" id="dataTable">
                    <thead>
                        <tr><th>Select a table to view data</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>No data to display</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="debugInfo" class="debug-info collapsed">
        <div class="debug-header" id="debugHeader">
            <h4>Debug Log</h4>
            <span class="debug-clear" id="debugClear">Clear</span>
        </div>
        <pre id="debugText"></pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'

        const supabaseUrl = 'https://nrrpljbprqiobcxbyuok.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycnBsamJwcnFpb2JjeGJ5dW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwOTM4MjAsImV4cCI6MjA2MTY2OTgyMH0.uDJsM_mzz9lVvPp92Z7JGWKUVOn7a4qkg8HDHAaQXjM'
        const supabase = createClient(supabaseUrl, supabaseKey)

        // Add all possible tables you might have
        const COMMON_TABLES = [
            'contacts',
            'messages', 
            'users', 
            'products', 
            'orders', 
            'customers',
            'contact_form',
            'contact_submissions',
            'inquiries',
            'uploads',
            'files',
            'images'
        ]

        let currentUser = null
        const debugInfo = document.getElementById('debugInfo')
        const debugText = document.getElementById('debugText')
        const debugHeader = document.getElementById('debugHeader')
        const debugClear = document.getElementById('debugClear')
        const tableInfo = document.getElementById('tableInfo')

        // Debug panel controls
        debugHeader.addEventListener('click', (e) => {
            if (e.target !== debugClear) {
                debugInfo.classList.toggle('collapsed')
            }
        })

        debugClear.addEventListener('click', (e) => {
            e.stopPropagation()
            debugText.textContent = ''
        })

        // Debug logging function
        function log(message, data = null) {
            const timestamp = new Date().toLocaleTimeString()
            let logMessage = `[${timestamp}] ${message}\n`
            if (data) {
                logMessage += JSON.stringify(data, null, 2) + '\n'
            }
            debugText.textContent = logMessage + debugText.textContent
            console.log(message, data)
        }

        // Elements
        const loginForm = document.getElementById('loginForm')
        const dbContent = document.getElementById('dbContent')
        const authForm = document.getElementById('authForm')
        const tableSelect = document.getElementById('tableSelect')
        const dataTable = document.getElementById('dataTable')
        const loading = document.getElementById('loading')
        const logoutBtn = document.getElementById('logoutBtn')

        // Check if user is already logged in
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                currentUser = session.user
                log('User logged in', { email: session.user.email })
                showDatabaseContent()
            }
        })

        // Login form submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                })

                if (error) throw error

                currentUser = data.user
                showDatabaseContent()
            } catch (error) {
                alert('Error logging in: ' + error.message)
            }
        })

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut()
            currentUser = null
            showLoginForm()
        })

        // Show database content
        async function showDatabaseContent() {
            loginForm.style.display = 'none'
            dbContent.style.display = 'block'
            await loadTables()
        }

        // Show login form
        function showLoginForm() {
            loginForm.style.display = 'block'
            dbContent.style.display = 'none'
            authForm.reset()
        }

        // Load available tables
        async function loadTables() {
            loading.style.display = 'block'
            tableSelect.innerHTML = '<option value="">Loading tables...</option>'

            const existingTables = []
            
            for (const tableName of COMMON_TABLES) {
                try {
                    const { data, error } = await supabase
                        .from(tableName)
                        .select('*', { count: 'exact' })
                        .limit(0)
                    
                    if (!error) {
                        const count = data?.length || 0
                        existingTables.push({ name: tableName, count })
                        log(`Found table: ${tableName}`, { count })
                    }
                } catch (error) {
                    // Skip tables that don't exist
                }
            }

            if (existingTables.length === 0) {
                tableSelect.innerHTML = '<option value="">No tables found</option>'
                tableInfo.textContent = 'No tables available'
            } else {
                tableSelect.innerHTML = '<option value="">Select a table</option>' +
                    existingTables.map(table => 
                        `<option value="${table.name}">${table.name} (${table.count} records)</option>`
                    ).join('')
                tableInfo.textContent = `${existingTables.length} tables available`
            }
            
            loading.style.display = 'none'
        }

        // Handle table selection
        tableSelect.addEventListener('change', async (e) => {
            const tableName = e.target.value
            if (!tableName) {
                dataTable.innerHTML = '<thead><tr><th>Select a table to view data</th></tr></thead><tbody><tr><td>No data to display</td></tr></tbody>'
                tableInfo.textContent = 'No table selected'
                return
            }

            loading.style.display = 'block'

            try {
                const { data, error } = await supabase
                    .from(tableName)
                    .select('*')

                if (error) throw error

                if (data.length === 0) {
                    dataTable.innerHTML = '<thead><tr><th>No Data</th></tr></thead><tbody><tr><td>This table is empty</td></tr></tbody>'
                    tableInfo.textContent = `Table '${tableName}' is empty`
                    return
                }

                const columns = Object.keys(data[0])
                const thead = `<thead><tr>${columns.map(col => `<th>${col}</th>`).join('')}</tr></thead>`
                const tbody = `<tbody>${data.map(row => 
                    `<tr>${columns.map(col => `<td>${row[col] || ''}</td>`).join('')}</tr>`
                ).join('')}</tbody>`

                dataTable.innerHTML = thead + tbody
                tableInfo.textContent = `Showing ${data.length} records from '${tableName}'`

            } catch (error) {
                dataTable.innerHTML = '<thead><tr><th>Error</th></tr></thead><tbody><tr><td>Error loading table data</td></tr></tbody>'
                tableInfo.textContent = `Error loading table '${tableName}'`
            }

            loading.style.display = 'none'
        })
    </script>
</body>
</html>
